<title>Sandy's Things</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Courier+Prime:wght@400;700&display=swap">
<style>
  /* ---------- tokens: page chrome (theme-aware) ---------- */
  :root{
    --ground:      #EAE7E1;
    --ground-lift: #F4F2ED;
    --ink:         #2A2724;
    --ink-soft:    #6F6960;
    --hair:        rgba(42,39,36,.16);
    --hair-soft:   rgba(42,39,36,.08);
    --focus:       #2A2724;
    /* the clock's road surface */
    --road:        #F1EFEA;
    --lane:        rgba(42,39,36,.055);
    --lane-line:   rgba(42,39,36,.13);
    --manhole:     rgba(42,39,36,.16);
    --manhole-in:  rgba(42,39,36,.09);
    --car-glass:   rgba(28,30,36,.80);
    --car-shadow:  rgba(42,39,36,.20);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:      #131211;
      --ground-lift: #1C1A18;
      --ink:         #EFECE6;
      --ink-soft:    #8B847A;
      --hair:        rgba(239,236,230,.18);
      --hair-soft:   rgba(239,236,230,.08);
      --focus:       #EFECE6;
      --road:        #191817;
      --lane:        rgba(239,236,230,.05);
      --lane-line:   rgba(239,236,230,.11);
      --manhole:     rgba(239,236,230,.15);
      --manhole-in:  rgba(239,236,230,.08);
      --car-glass:   rgba(16,17,20,.82);
      --car-shadow:  rgba(0,0,0,.38);
    }
  }
  :root[data-theme="dark"]{
    --ground:#131211; --ground-lift:#1C1A18; --ink:#EFECE6; --ink-soft:#8B847A;
    --hair:rgba(239,236,230,.18); --hair-soft:rgba(239,236,230,.08); --focus:#EFECE6;
    --road:#191817; --lane:rgba(239,236,230,.05); --lane-line:rgba(239,236,230,.11);
    --manhole:rgba(239,236,230,.15); --manhole-in:rgba(239,236,230,.08);
    --car-glass:rgba(16,17,20,.82); --car-shadow:rgba(0,0,0,.38);
  }

  /* ---------- tokens: destination brands (fixed in both themes) ---------- */
  :root{
    --g-1:#f5f7fa; --g-2:#c3cfe2; --g-2-deep:#aebdd5;
    --g-ink:#374151; --g-soft:#6b7280; --g-hair:#d1d5db; --g-accent:#059669;
    --r-bg:#A9431F; --r-lift:#BC5330; --r-deep:#8E3617;
    --r-ink:#ffffff; --r-muted:rgba(255,255,255,.66); --r-line:rgba(255,255,255,.24);
    /* fifa price predictor — the four blues from the tool itself, plus two
       lighter steps of the same hue for type and marks */
    --f-bg:#17253c; --f-panel:#1f3050; --f-panel-2:#26395c; --f-line:#33486e;
    --f-ink:#E7EDF8; --f-muted:#93A7C7;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--ground);
    color:var(--ink);
    font-family:"Archivo","Helvetica Neue",Arial,sans-serif;
    font-variation-settings:"wdth" 100;
    -webkit-font-smoothing:antialiased;
  }

  .frame{
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    gap:clamp(14px,2vh,22px);
    padding:clamp(16px,2.4vw,30px);
  }

  .masthead{
    flex:none;display:flex;align-items:baseline;justify-content:space-between;
    gap:20px;padding-inline:2px;
  }
  .wordmark{
    font-size:clamp(38px,6.4vw,76px);font-weight:800;
    font-variation-settings:"wdth" 112,"wght" 800;
    letter-spacing:-.035em;line-height:.86;text-wrap:balance;
  }
  .byline{
    font-family:"Courier Prime","Courier New",monospace;font-size:12px;
    letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);
    white-space:nowrap;padding-bottom:.3em;
  }

  .rack{
    flex:1 1 auto;display:grid;
    grid-template-columns:1fr 2fr 1fr;
    grid-template-rows:minmax(0,1fr);   /* the viewport decides, not the content */
    gap:clamp(10px,1.4vw,18px);min-height:0;
  }

  .panel{
    position:relative;overflow:hidden;display:flex;flex-direction:column;
    justify-content:space-between;gap:18px;padding:clamp(18px,2vw,30px);
    text-decoration:none;border-radius:2px;isolation:isolate;
    opacity:0;transform:translateY(14px);
    animation:settle .62s cubic-bezier(.22,.7,.3,1) forwards;
  }
  .d1{animation-delay:.04s} .d2{animation-delay:.13s}
  .d3{animation-delay:.20s} .d4{animation-delay:.27s}
  @keyframes settle{to{opacity:1;transform:none}}

  /* the middle column: clock over the price model, two to one */
  .mid{
    display:grid;
    /* minmax(0,·) so the price model's own content can never push the whole
       rack taller than the viewport on a short window */
    grid-template-rows:minmax(0,2fr) minmax(0,1fr);
    gap:clamp(10px,1.4vw,18px);min-height:0;
  }
  .panel:focus-visible{outline:2px solid var(--focus);outline-offset:3px}

  .p-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .p-label{font-size:11px;letter-spacing:.2em;text-transform:uppercase}
  .p-arrow{font-size:15px;line-height:1;transition:transform .3s cubic-bezier(.22,.7,.3,1)}
  .panel:hover .p-arrow,.panel:focus-visible .p-arrow{transform:translate(3px,-3px)}
  .p-mark{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0;padding:6px 0}
  .p-name{
    font-size:clamp(21px,2.5vw,34px);font-weight:700;
    font-variation-settings:"wdth" 104,"wght" 700;letter-spacing:-.02em;line-height:1;
  }
  .p-domain{margin-top:8px;font-size:12px;letter-spacing:.06em}

  /* ---------- panel: Daily 5x5 ---------- */
  .p--games{
    background:linear-gradient(135deg,var(--g-1) 0%,var(--g-2) 100%);
    color:var(--g-ink);border:1px solid var(--g-hair);
  }
  .p--games::before{
    content:"";position:absolute;inset:0;z-index:-1;
    background:linear-gradient(135deg,var(--g-1) 0%,var(--g-2-deep) 100%);
    opacity:0;transition:opacity .4s ease;
  }
  .p--games:hover::before,.p--games:focus-visible::before{opacity:1}
  .p--games .p-label,.p--games .p-domain{
    font-family:"Courier Prime","Courier New",monospace;color:var(--g-soft);
  }
  .p--games .p-arrow{color:var(--g-soft)}
  .grid5{
    display:grid;grid-template-columns:repeat(5,1fr);
    /* square, and bounded by whichever of the two axes runs out first */
    aspect-ratio:1;width:auto;height:100%;max-height:180px;max-width:100%;
    border:1.5px solid var(--g-ink);background:var(--g-ink);gap:1.5px;
  }
  .grid5 i{background:var(--g-1)}
  .grid5 i.blk{background:var(--g-ink)}
  .grid5 i.sol{background:var(--g-accent)}

  /* ---------- panel: RecipeTap ---------- */
  .p--recipes{
    background:var(--r-bg);color:var(--r-ink);border:1px solid var(--r-deep);
    transition:background-color .4s ease;
  }
  .p--recipes:hover,.p--recipes:focus-visible{background:var(--r-lift)}
  .p--recipes .p-label{color:var(--r-muted);letter-spacing:.22em}
  .p--recipes .p-domain,.p--recipes .p-arrow{color:var(--r-muted)}
  .stack{width:min(100%,180px);display:flex;flex-direction:column;gap:15px}
  .stack span{display:flex;align-items:center;gap:11px}
  .stack span::before{
    content:"";flex:none;width:7px;height:7px;border-radius:50%;
    border:1.5px solid var(--r-line);
  }
  .stack span::after{content:"";height:1px;background:var(--r-line)}
  .stack span:nth-child(1)::after{width:100%}
  .stack span:nth-child(2)::after{width:62%}
  .stack span:nth-child(3)::after{width:84%}
  .stack span:nth-child(4)::after{width:44%}
  .stack span:nth-child(2)::before{background:var(--r-line)}

  /* ---------- panel: the clock ---------- */
  .p--clock{
    background:var(--road);
    border:1px solid var(--hair);
    padding:0;display:block;
  }
  /* absolute so the canvas never feeds its own intrinsic size back into the
     grid — the row decides the height, the canvas just fills it */
  #carclock{position:absolute;inset:0;display:block;width:100%;height:100%}

  /* ---------- panel: FIFA price predictor ---------- */
  .p--fifa{
    flex-direction:row;align-items:center;justify-content:space-between;
    gap:clamp(16px,2vw,32px);
    padding:clamp(16px,1.8vw,28px);
    background:var(--f-bg);
    border:1px solid var(--f-line);
    transition:background-color .4s ease;
    /* the grid gives this panel its height; without size containment its own
       content would push the rack past the viewport on a short window */
    contain:size;
  }
  .p--fifa:hover,.p--fifa:focus-visible{background:var(--f-panel)}
  .p--fifa .p-label{color:var(--f-muted);letter-spacing:.2em}
  .p--fifa .p-name{color:var(--f-ink);font-size:clamp(19px,2.1vw,30px)}
  .p--fifa .p-domain{color:var(--f-muted);margin-top:0}
  /* a wide bar reads better with the arrow trailing the line than pinned to a
     far corner, so this one sits at the end rather than top-right */
  .p--fifa .p-arrow{color:var(--f-muted);flex:none;align-self:center}
  .f-text{display:flex;flex-direction:column;gap:7px;min-width:0;flex:1 1 auto}
  .f-mark{
    flex:none;display:block;
    width:clamp(96px,19vw,196px);height:auto;max-height:100%;
  }

  /* ---------- stacked: puzzle on top, clock, recipes ----------
     Everything is sized to the viewport so the page never scrolls. The clock
     row takes the height its four digits actually need at this width — any
     taller and it only letterboxes — and the two link panels share the rest. */
  @media (max-width:860px){
    .frame{
      height:100dvh;overflow:hidden;
      gap:clamp(10px,1.6vh,16px);
      padding:clamp(12px,3.2vw,20px);
    }
    .wordmark{font-size:clamp(30px,8.5vw,44px)}
    .rack{
      grid-template-columns:1fr;
      /* the middle row carries the clock and the price model together */
      grid-template-rows:minmax(170px,1fr) minmax(180px,min(44vh,72vw)) minmax(140px,1fr);
      gap:clamp(8px,1.2vh,12px);
    }
    .mid{gap:clamp(8px,1.2vh,12px)}
    .panel{padding:14px 16px;gap:10px}
    .p--fifa{padding:12px 14px;gap:11px}
    .p--fifa .p-name{font-size:clamp(17px,4.6vw,23px)}
    .f-text{gap:5px}
    .f-mark{width:clamp(78px,22vw,120px)}
    .p-mark{padding:2px 0;overflow:hidden}
    .grid5{max-height:132px}
    .stack{width:min(100%,168px);gap:clamp(8px,1.5vh,15px)}
    .p-label{font-size:10px;letter-spacing:.18em}
    .p-name{font-size:clamp(20px,5.6vw,27px)}
    .p-domain{margin-top:5px;font-size:11px}
  }
  @media (max-width:460px){
    .masthead{flex-direction:column;align-items:flex-start;gap:5px}
    .byline{padding-bottom:0;font-size:11px}
  }
  /* short phones: show a shorter ingredient list rather than a clipped one */
  @media (max-width:860px) and (max-height:720px){
    .stack span:nth-child(n+3){display:none}
  }
  /* a phone on its side has no height to give away — let it scroll instead */
  @media (max-width:860px) and (max-height:520px){
    .frame{height:auto;min-height:100dvh;overflow:visible}
    .rack{grid-template-rows:minmax(190px,auto) min(78vh,50vw) minmax(190px,auto)}
    .p--fifa .p-domain{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .panel{animation:none;opacity:1;transform:none}
    .p-arrow{transition:none}
  }
</style>

<main class="frame">

    <h1 class="wordmark">Things</h1>
    <p class="byline">Sandy Mulcahy</p>

    <a class="panel p--games d1" href="https://sandys.games" target="_blank" rel="noopener">

          <i></i><i></i><i></i><i></i><i class="blk"></i>

        <svg class="f-mark" viewBox="0 0 150 88" aria-hidden="true">
          <rect x="0.7" y="0.7" width="148.6" height="86.6" rx="4"
                fill="var(--f-panel)" stroke="var(--f-line)" stroke-width="1.4"/>
          <path d="M16 72 H136 M16 72 V14" stroke="var(--f-line)" stroke-width="1.2" fill="none"/>
          <path d="M18 70 L134 17" stroke="var(--f-ink)" stroke-width="1.6"
                fill="none" stroke-linecap="round"/>
          <g fill="var(--f-muted)">
            <circle cx="27"  cy="64" r="2.6"/><circle cx="38" cy="67" r="2.6"/>
            <circle cx="46"  cy="57" r="2.6"/><circle cx="57" cy="59" r="2.6"/>
            <circle cx="64"  cy="48" r="2.6"/><circle cx="75" cy="47" r="2.6"/>
            <circle cx="83"  cy="52" r="2.6"/><circle cx="93" cy="37" r="2.6"/>
            <circle cx="103" cy="40" r="2.6"/><circle cx="112" cy="28" r="2.6"/>
            <circle cx="124" cy="25" r="2.6"/>

      <div class="p-top">
        <span class="p-label">Recipes</span>
        <span class="p-arrow" aria-hidden="true">&#8599;</span>
      </div>
      <div class="p-mark">
        <div class="stack" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>

        <div class="p-name">RecipeTap</div>
        <div class="p-domain">recipetap.food</div>

  </div>
</main>

<script>
/* ============================================================================
   CAR CLOCK — HH:MM, twenty-eight cars

   Each digit is seven cars parked in a seven-segment layout, seen from above.

              TL              TR      off screen, above
                  _  1  _
                2         3
                  _  4  _
                5         6
                  _  7  _
              BL              BR      off screen, below

   Every car has a fixed route through the ten digits, and the seven routes
   hand on between cars over six ten-digit cycles, so a nine turning over to a
   zero costs almost no driving. Trips are a straight run down a lane, or a
   straight, a quarter circle and another straight; cars reverse where the bay
   they are leaving points the wrong way, and turn around off screen where
   nobody can see them. All the cars in a digit pull away at the same moment —
   separation comes from turning radius and pace, searched per transition.

   Console handles live on window.CarClock.
   ========================================================================== */
(function () {
  'use strict';

  /* ---------- one digit's geometry ---------- */
  var CL = 96, CW = 34, GAP = 28;
  var XOFF = CL / 2 + CW / 2 + GAP;   // 93 — lanes, a clear GAP from every bay
  var YSTEP = CW + 2 * GAP + CL;      // 186
  var H = Math.PI / 2;

  var BAYS = {
    1:  { x: 0,     y: -YSTEP,     vert: false },
    2:  { x: -XOFF, y: -YSTEP / 2, vert: true  },
    3:  { x:  XOFF, y: -YSTEP / 2, vert: true  },
    4:  { x: 0,     y: 0,          vert: false },
    5:  { x: -XOFF, y:  YSTEP / 2, vert: true  },
    6:  { x:  XOFF, y:  YSTEP / 2, vert: true  },
    7:  { x: 0,     y:  YSTEP,     vert: false },
    TL: { x: -XOFF, y: -330, vert: true, off: true, dir: -1 },
    TR: { x:  XOFF, y: -330, vert: true, off: true, dir: -1 },
    BL: { x: -XOFF, y:  330, vert: true, off: true, dir:  1 },
    BR: { x:  XOFF, y:  330, vert: true, off: true, dir:  1 }
  };

  var VIEW_H = 270;        // the display band; past this a car is gone
  var FADE = 55;           // and it dissolves over this much of the approach
  var OFF_QUEUE = CL + GAP;

  var CARS = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];
  var PALETTE = ['#E23B32', '#2D6FD6', '#F2C41B', '#2FA85B',
                 '#F07C21', '#8B4FD1', '#E4E6EC'];

  var ROUTES = {
    A: [ 2, 'TL',   4,   4,   4,   4,   4,   3,  4,  4 ],
    B: [ 1, 'TR',   1,   1,   2,   2,   2, 'TL', 2,  2 ],
    C: [ 3,   3,    3,   3,   3,   1,   1,   1,  1,  1 ],
    D: [ 5, 'BL',   5, 'BL','BL','BL',  5, 'BL', 5,'BL'],
    E: [ 7, 'BR', 'BR',  6,   6,   6,   6,   6,  6,  6 ],
    F: [ 6,   6,    7,   7, 'BR',  7,   7, 'BR', 7,  7 ],
    G: ['TR','TR','TR','TR','TR','TR','TR','TR', 3,  3 ]
  };

  var TRIO = ['A', 'B', 'C'], PAIR = ['E', 'F'];
  function roleOf(car, cyc) {
    var i = TRIO.indexOf(car);
    if (i >= 0) return TRIO[((i - cyc) % 3 + 3) % 3];
    i = PAIR.indexOf(car);
    if (i >= 0) return PAIR[((i - cyc) % 2 + 2) % 2];
    return car;
  }

  var TUNING = {
    speed: 112,          // units per second at pace 1 — deliberately unhurried
    base: 320,
    minDur: 700, maxDur: 6500,
    spinFrac: 0.24
  };

  /* ---------- four digits across the panel ---------- */
  var DIG_HW = XOFF + CW / 2;                 // 110
  var DIG_GAP = 66, COLON_GAP = 128;
  var PITCH = DIG_HW * 2 + DIG_GAP;           // 294
  var CX = [];
  (function () {
    var span = 4 * DIG_HW * 2 + 2 * DIG_GAP + COLON_GAP;
    var left = -span / 2 + DIG_HW;
    CX = [left, left + PITCH, left + PITCH + DIG_HW * 2 + COLON_GAP, 0];
    CX[3] = CX[2] + PITCH;
    return CX;
  })();
  var WORLD_W = 4 * DIG_HW * 2 + 2 * DIG_GAP + COLON_GAP + 56;
  var MANHOLE_Y = YSTEP / 2, MANHOLE_R = 27;

  /* ---------- vector odds and ends ---------- */
  function sgn(v) { return v > .5 ? 1 : v < -.5 ? -1 : 0; }
  function norm(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; }
  function angOf(v) { return Math.atan2(v.y, v.x); }
  function dotv(a, b) { return a.x * b.x + a.y * b.y; }
  function samePlace(p, q) { return Math.abs(p.x - q.x) < .5 && Math.abs(p.y - q.y) < .5; }
  function offBand(p) { return Math.abs(p.y) > VIEW_H; }
  function easeInOut(t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

  function legDirs(A, B) {
    if (A.vert === B.vert) {
      var d = A.vert ? { x: 0, y: sgn(B.y - A.y) } : { x: sgn(B.x - A.x), y: 0 };
      return { d1: d, d2: d, corner: null };
    }
    var c = A.vert ? { x: A.x, y: B.y } : { x: B.x, y: A.y };
    return {
      d1: A.vert ? { x: 0, y: sgn(c.y - A.y) } : { x: sgn(c.x - A.x), y: 0 },
      d2: B.vert ? { x: 0, y: sgn(B.y - c.y) } : { x: sgn(B.x - c.x), y: 0 },
      corner: c
    };
  }

  function arcInto(pts, C, r, a0, a1) {
    var sweep = a1 - a0;
    while (sweep >  Math.PI) sweep -= 2 * Math.PI;
    while (sweep < -Math.PI) sweep += 2 * Math.PI;
    for (var i = 1; i <= 14; i++) {
      var a = a0 + sweep * (i / 14);
      pts.push({ x: C.x + Math.cos(a) * r, y: C.y + Math.sin(a) * r });
    }
  }
  // one quarter circle at a corner, joining a run in direction din to one in dout
  function bend(pts, corner, din, dout, r) {
    var P1 = { x: corner.x - din.x * r,  y: corner.y - din.y * r };
    var P2 = { x: corner.x + dout.x * r, y: corner.y + dout.y * r };
    var C  = { x: P1.x + dout.x * r,     y: P1.y + dout.y * r };
    pts.push(P1);
    arcInto(pts, C, r, Math.atan2(P1.y - C.y, P1.x - C.x), Math.atan2(P2.y - C.y, P2.x - C.x));
    return P2;
  }

  function buildPath(A, B, radius) {
    var pts = [{ x: A.x, y: A.y }], d1, d2;
    var sameAxis = A.vert === B.vert;
    var offset = sameAxis && (A.vert ? Math.abs(A.x - B.x) > .5 : Math.abs(A.y - B.y) > .5);

    if (sameAxis && !offset) {                     // one straight run down the lane
      var L0 = legDirs(A, B);
      d1 = d2 = L0.d1;
      pts.push({ x: B.x, y: B.y });

    } else if (!sameAxis) {                        // straight, quarter circle, straight
      var L = legDirs(A, B);
      d1 = L.d1; d2 = L.d2;
      var len1 = Math.hypot(L.corner.x - A.x, L.corner.y - A.y);
      var len2 = Math.hypot(B.x - L.corner.x, B.y - L.corner.y);
      var r1 = Math.max(10, Math.min(radius, len1, len2));
      bend(pts, L.corner, d1, d2, r1);
      pts.push({ x: B.x, y: B.y });

    } else {
      // Two bays on the same axis but different lines — only reachable on a
      // jump the running clock never makes (a tab waking after hours, say).
      // Cross over beyond both bays, so two quarter circles and three straights.
      var uA = A.vert ? { x: 0, y: 1 } : { x: 1, y: 0 };   // along the bay
      var uC = A.vert ? { x: 1, y: 0 } : { x: 0, y: 1 };   // across to the other line
      var aA = A.vert ? A.y : A.x, aB = B.vert ? B.y : B.x;
      var cA = A.vert ? A.x : A.y, cB = B.vert ? B.x : B.y;
      var need = radius + 8;
      var m = (aA + aB) / 2 >= 0 ? Math.max(aA, aB) + need : Math.min(aA, aB) - need;
      var r2 = Math.max(10, Math.min(radius, Math.abs(cA - cB) / 2,
                                     Math.abs(m - aA), Math.abs(m - aB)));
      var s1 = sgn(m - aA) || 1, s2 = sgn(aB - m) || 1, sc = sgn(cB - cA) || 1;
      d1 = { x: uA.x * s1, y: uA.y * s1 };
      var dm = { x: uC.x * sc, y: uC.y * sc };
      d2 = { x: uA.x * s2, y: uA.y * s2 };
      var k1 = A.vert ? { x: A.x, y: m } : { x: m, y: A.y };
      var k2 = A.vert ? { x: B.x, y: m } : { x: m, y: B.y };
      bend(pts, k1, d1, dm, r2);
      bend(pts, k2, dm, d2, r2);
      pts.push({ x: B.x, y: B.y });
    }

    var cum = [0], len = 0;
    for (var k = 1; k < pts.length; k++) {
      len += Math.hypot(pts[k].x - pts[k - 1].x, pts[k].y - pts[k - 1].y);
      cum.push(len);
    }
    return { pts: pts, cum: cum, len: len, d1: d1, d2: d2 };
  }

  function onPath(path, u) {
    var d = u * path.len, lo = 0, hi = path.cum.length - 1;
    while (lo < hi - 1) { var m = (lo + hi) >> 1; if (path.cum[m] <= d) lo = m; else hi = m; }
    var span = path.cum[hi] - path.cum[lo] || 1;
    var f = (d - path.cum[lo]) / span;
    var p = path.pts[lo], q = path.pts[hi];
    return { x: p.x + (q.x - p.x) * f, y: p.y + (q.y - p.y) * f,
             t: Math.atan2(q.y - p.y, q.x - p.x) };
  }

  /* ---------- a trip -------------------------------------------------------
     Headings are carried by the cars themselves rather than looked up, so any
     jump between digits works, not only the ones the loop makes. A car that
     would have to reverse out of an off-screen bay turns around first, which
     nobody sees; on screen it just reverses.
  ------------------------------------------------------------------------- */
  function makeTrip(from, to, radius) {
    var path = buildPath(from, to, radius);
    var hv = { x: Math.cos(from.a), y: Math.sin(from.a) };
    var fwd = dotv(hv, path.d1) > 0;
    var pre = false;
    if (!fwd && offBand(from)) { pre = true; fwd = true; }
    return {
      path: path, fwd: fwd, pre: pre,
      a0: from.a, aDrive: pre ? norm(from.a + Math.PI) : from.a,
      a1: norm(angOf(path.d2) + (fwd ? 0 : Math.PI)),
      from: from, to: to
    };
  }

  function tripPose(trip, u) {
    if (u <= 0) return { x: trip.from.x, y: trip.from.y, a: trip.a0, rev: false };
    if (u >= 1) return { x: trip.to.x, y: trip.to.y, a: trip.a1, rev: false };
    var sf = trip.pre ? TUNING.spinFrac : 0;
    if (u < sf) {
      return { x: trip.from.x, y: trip.from.y,
               a: norm(trip.a0 + norm(trip.aDrive - trip.a0) * easeInOut(u / sf)), rev: false };
    }
    var v = easeInOut((u - sf) / (1 - sf));
    var pt = onPath(trip.path, v);
    var a = trip.fwd ? pt.t : pt.t + Math.PI;
    if (v > 0.88) a += norm(trip.a1 - a) * ((v - 0.88) / 0.12);
    return { x: pt.x, y: pt.y, a: norm(a), rev: !trip.fwd, u: v };
  }

  /* ---------- collision test ---------- */
  var PLAN_PAD = 7;
  function box(p, pad) {
    var ca = Math.cos(p.a), sa = Math.sin(p.a);
    return { c: p, ax: { x: ca, y: sa }, ay: { x: -sa, y: ca },
             hl: CL / 2 + pad, hw: CW / 2 + pad };
  }
  function hit(A, B) {
    var d = { x: B.c.x - A.c.x, y: B.c.y - A.c.y }, axes = [A.ax, A.ay, B.ax, B.ay];
    for (var i = 0; i < 4; i++) {
      var ax = axes[i];
      var ra = Math.abs(dotv(A.ax, ax)) * A.hl + Math.abs(dotv(A.ay, ax)) * A.hw;
      var rb = Math.abs(dotv(B.ax, ax)) * B.hl + Math.abs(dotv(B.ay, ax)) * B.hw;
      if (Math.abs(dotv(d, ax)) > ra + rb) return false;
    }
    return true;
  }

  /* ---------- where a car parks ---------- */
  function bayPos(car, value, cyc) {
    var k = ROUTES[roleOf(car, cyc)][value], b = BAYS[k];
    if (!b.off) return { x: b.x, y: b.y, vert: b.vert, slot: k };
    var q = 0;
    for (var i = 0; i < CARS.length; i++) {
      if (CARS[i] === car) break;
      if (ROUTES[roleOf(CARS[i], cyc)][value] === k) q++;
    }
    return { x: b.x, y: b.y + b.dir * q * OFF_QUEUE, vert: b.vert, slot: k };
  }

  /* ---------- planning ---------- */
  var RADII = [52, 40, 64, 30, 74];
  var PACE  = [1, 0.87, 1.13, 0.76, 1.26, 0.66, 1.4];
  var CANDS = [];
  for (var p_ = 0; p_ < PACE.length; p_++)
    for (var r_ = 0; r_ < RADII.length; r_++)
      CANDS.push({ r: RADII[r_], pace: PACE[p_] });
  var NODE_CAP = 6000;

  function planMove(poses, targets) {
    var movers = [], statics = [];
    CARS.forEach(function (c) {
      if (samePlace(poses[c], targets[c])) statics.push(poses[c]);
      else movers.push({ car: c, from: poses[c], to: targets[c] });
    });
    if (!movers.length) return { movers: [], total: 0, solved: true };

    function durOf(trip, pace) {
      var d = TUNING.base + (trip.path.len / (TUNING.speed * pace)) * 1000;
      if (trip.pre) d /= (1 - TUNING.spinFrac);
      return Math.max(TUNING.minDur, Math.min(TUNING.maxDur, d));
    }
    function build(r, cand) {
      var trip = makeTrip(r.from, r.to, cand.r);
      return { rec: r, trip: trip, dur: durOf(trip, cand.pace) };
    }
    function at(c, t) { return tripPose(c.trip, t / c.dur); }

    var order = movers.slice().sort(function (a, b) {
      return buildPath(b.from, b.to, 52).len - buildPath(a.from, a.to, 52).len;
    });

    var nodes = 0;
    function clashes(cand, done) {
      var end = done.reduce(function (m, o) { return Math.max(m, o.dur); }, cand.dur) + 60;
      for (var t = 0; t <= end; t += 18) {
        var me = at(cand, t), k, o;
        for (k = 0; k < statics.length; k++) {
          o = statics[k];
          if (offBand(me) && offBand(o)) continue;
          if (hit(box(me, PLAN_PAD), box(o, PLAN_PAD))) return true;
        }
        for (k = 0; k < done.length; k++) {
          o = at(done[k], t);
          if (offBand(me) && offBand(o)) continue;
          if (hit(box(me, PLAN_PAD), box(o, PLAN_PAD))) return true;
        }
      }
      return false;
    }

    var chosen = null;
    (function dfs(i, done) {
      if (i === order.length) { chosen = done.slice(); return true; }
      for (var ci = 0; ci < CANDS.length; ci++) {
        if (++nodes > NODE_CAP) return false;
        var cand = build(order[i], CANDS[ci]);
        if (clashes(cand, done)) continue;
        done.push(cand);
        if (dfs(i + 1, done)) return true;
        done.pop();
      }
      return false;
    })(0, []);

    var solved = !!chosen;
    if (!chosen) chosen = order.map(function (r) { return build(r, CANDS[0]); });
    chosen.forEach(function (c) { c.car = c.rec.car; });
    var total = chosen.reduce(function (m, c) { return Math.max(m, c.dur); }, 0);
    return { movers: chosen, total: total, solved: solved, nodes: nodes };
  }

  /* ---------- a digit ---------- */
  function shuffled(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function makeDigit(index, value) {
    var d = {
      index: index, cx: CX[index], value: value, cyc: 0,
      color: {}, poses: {}, plan: null, t0: 0
    };
    var pal = index === 0 ? PALETTE.slice() : shuffled(PALETTE);
    CARS.forEach(function (c, i) {
      d.color[c] = pal[i];
      var b = bayPos(c, value, 0);
      d.poses[c] = { x: b.x, y: b.y, a: b.vert ? H : 0, vert: b.vert, slot: b.slot };
    });
    return d;
  }

  function setDigit(d, value) {
    if (value === d.value) return 0;
    if (value < d.value) d.cyc = (d.cyc + 1) % 6;     // a wrap hands the routes on
    d.value = value;
    var targets = {};
    CARS.forEach(function (c) { targets[c] = bayPos(c, value, d.cyc); });
    var pl = planMove(d.poses, targets);
    if (!pl.solved) {
      // No safe set of paths — only possible on a jump the clock doesn't make
      // (a tab waking hours later). Put the cars straight into place rather
      // than drive something that would collide.
      CARS.forEach(function (c) {
        var t = targets[c];
        d.poses[c] = { x: t.x, y: t.y, a: t.vert ? H : 0, vert: t.vert, slot: t.slot };
      });
      d.plan = null;
      return 0;
    }
    d.plan = pl;
    d.targets = targets;
    d.t0 = performance.now();
    return d.plan.total;
  }

  /* =========================================================================
     RENDER
     ========================================================================= */
  var canvas = document.getElementById('carclock');
  var g = canvas.getContext('2d');
  var view = { s: 1, ox: 0, oy: 0, halfH: 400 };
  var T = {};
  var digits = [];

  function readTheme() {
    var cs = getComputedStyle(canvas);
    T = {
      road:  cs.getPropertyValue('--road').trim(),
      lane:  cs.getPropertyValue('--lane').trim(),
      line:  cs.getPropertyValue('--lane-line').trim(),
      man:   cs.getPropertyValue('--manhole').trim(),
      manIn: cs.getPropertyValue('--manhole-in').trim(),
      glass: cs.getPropertyValue('--car-glass').trim(),
      shade: cs.getPropertyValue('--car-shadow').trim()
    };
  }

  function resize() {
    var r = canvas.parentElement.getBoundingClientRect();
    if (!r.width || !r.height) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    var pad = 12;
    view.s = Math.min((r.width - pad * 2) / WORLD_W, (r.height - pad * 2) / (VIEW_H * 2)) * dpr;
    view.ox = canvas.width / 2;
    view.oy = canvas.height / 2;
    view.halfH = (canvas.height / 2) / view.s;
    draw();
  }

  function rr(x, y, w, h, rad) {
    if (g.roundRect) { g.beginPath(); g.roundRect(x, y, w, h, rad); return; }
    g.beginPath(); g.moveTo(x + rad, y); g.arcTo(x + w, y, x + w, y + h, rad);
    g.arcTo(x + w, y + h, x, y + h, rad); g.arcTo(x, y + h, x, y, rad);
    g.arcTo(x, y, x + w, y, rad); g.closePath();
  }
  function shade(hex, f) {
    var n = parseInt(hex.slice(1), 16), r = n >> 16, gg = (n >> 8) & 255, b = n & 255;
    var m = f < 0 ? 0 : 255, k = Math.abs(f);
    return 'rgb(' + Math.round(r + (m - r) * k) + ',' + Math.round(gg + (m - gg) * k) + ',' + Math.round(b + (m - b) * k) + ')';
  }

  function drawRoads() {
    var top = -view.halfH - 40, bot = view.halfH + 40;
    g.lineCap = 'butt';
    for (var i = 0; i < 4; i++) {
      [-XOFF, XOFF].forEach(function (dx) {
        var x = CX[i] + dx;
        g.strokeStyle = T.lane; g.lineWidth = CW + 26;
        g.beginPath(); g.moveTo(x, top); g.lineTo(x, bot); g.stroke();
        g.strokeStyle = T.line; g.lineWidth = 1.5; g.setLineDash([10, 15]);
        g.beginPath(); g.moveTo(x, top); g.lineTo(x, bot); g.stroke();
        g.setLineDash([]);
      });
    }
    // the colon: two manhole covers set into the road
    [-MANHOLE_Y, MANHOLE_Y].forEach(function (y) {
      g.fillStyle = T.man;
      g.beginPath(); g.arc(0, y, MANHOLE_R, 0, Math.PI * 2); g.fill();
      g.fillStyle = T.manIn;
      g.beginPath(); g.arc(0, y, MANHOLE_R - 5.5, 0, Math.PI * 2); g.fill();
      g.strokeStyle = T.man; g.lineWidth = 1.6;
      g.beginPath(); g.arc(0, y, MANHOLE_R - 11, 0, Math.PI * 2); g.stroke();
      for (var k = 0; k < 8; k++) {
        var a = (k / 8) * Math.PI * 2 + Math.PI / 8;
        g.beginPath();
        g.moveTo(Math.cos(a) * (MANHOLE_R - 10), y + Math.sin(a) * (MANHOLE_R - 10));
        g.lineTo(Math.cos(a) * (MANHOLE_R - 3.5), y + Math.sin(a) * (MANHOLE_R - 3.5));
        g.stroke();
      }
    });
  }

  function drawCar(col, p, braking) {
    var fade = Math.min(1, Math.max(0, (VIEW_H - Math.abs(p.y)) / FADE + 1));
    if (fade <= 0.01) return;
    g.globalAlpha = Math.min(1, fade);
    g.save(); g.translate(p.x, p.y); g.rotate(p.a);

    g.fillStyle = T.shade; rr(-CL / 2 + 2, -CW / 2 + 4, CL, CW, 9); g.fill();
    g.fillStyle = col; rr(-CL / 2, -CW / 2, CL, CW, 9); g.fill();
    g.strokeStyle = shade(col, -0.42); g.lineWidth = 1.4;
    rr(-CL / 2, -CW / 2, CL, CW, 9); g.stroke();
    g.fillStyle = shade(col, -0.22); rr(-CL * 0.24, -CW / 2 + 4, CL * 0.46, CW - 8, 5); g.fill();

    g.fillStyle = T.glass;
    g.beginPath();
    g.moveTo(CL * .23, -CW / 2 + 4.4); g.lineTo(CL * .36, -CW / 2 + 7);
    g.lineTo(CL * .36, CW / 2 - 7);    g.lineTo(CL * .23, CW / 2 - 4.4);
    g.closePath(); g.fill();
    g.beginPath();
    g.moveTo(-CL * .25, -CW / 2 + 4.4); g.lineTo(-CL * .38, -CW / 2 + 7);
    g.lineTo(-CL * .38, CW / 2 - 7);    g.lineTo(-CL * .25, CW / 2 - 4.4);
    g.closePath(); g.fill();

    g.fillStyle = '#FFF6DC';
    g.fillRect(CL / 2 - 4.5, -CW / 2 + 4, 3.2, 6);
    g.fillRect(CL / 2 - 4.5, CW / 2 - 10, 3.2, 6);
    g.fillStyle = p.rev ? '#FFFFFF' : (braking ? '#FF5540' : 'rgba(190,58,42,.72)');
    g.fillRect(-CL / 2 + 1.4, -CW / 2 + 4, 3, 6);
    g.fillRect(-CL / 2 + 1.4, CW / 2 - 10, 3, 6);

    g.restore();
    g.globalAlpha = 1;
  }

  function draw() {
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.fillStyle = T.road || '#EFEDE8';
    g.fillRect(0, 0, canvas.width, canvas.height);
    g.setTransform(view.s, 0, 0, view.s, view.ox, view.oy);
    drawRoads();
    var now = performance.now();
    digits.forEach(function (d) {
      g.save(); g.translate(d.cx, 0);
      CARS.forEach(function (c) {
        var p = d.poses[c], braking = false;
        if (d.plan) {
          var m = null;
          for (var i = 0; i < d.plan.movers.length; i++)
            if (d.plan.movers[i].car === c) { m = d.plan.movers[i]; break; }
          if (m) {
            var u = (now - d.t0) / m.dur;
            p = tripPose(m.trip, u);
            braking = u > 0.7 && u < 1;
          }
        }
        drawCar(d.color[c], p, braking);
      });
      g.restore();
    });
  }

  /* ---------- animation ---------- */
  var raf = 0;
  function frame() {
    raf = 0;
    var now = performance.now(), busy = false;
    digits.forEach(function (d) {
      if (!d.plan) return;
      if (now - d.t0 >= d.plan.total) {
        d.plan.movers.forEach(function (m) {
          var t = d.targets[m.car];
          d.poses[m.car] = { x: t.x, y: t.y, a: m.trip.a1, vert: t.vert, slot: t.slot };
        });
        d.plan = null;
      } else busy = true;
    });
    draw();
    if (busy) raf = requestAnimationFrame(frame);
  }
  function kick() { if (!raf) raf = requestAnimationFrame(frame); }

  /* ---------- the clock ---------- */
  var forced = null;
  function nowDigits() {
    if (forced) return forced;
    var t = new Date(), h = t.getHours(), m = t.getMinutes();
    return [Math.floor(h / 10), h % 10, Math.floor(m / 10), m % 10];
  }

  function tick() {
    var v = nowDigits(), moved = false;
    for (var i = 0; i < 4; i++) if (v[i] !== digits[i].value) { setDigit(digits[i], v[i]); moved = true; }
    if (moved) {
      canvas.setAttribute('aria-label', v[0] + '' + v[1] + ':' + v[2] + v[3]);
      kick();
    }
  }

  /* ---------- boot ---------- */
  readTheme();
  var start = nowDigits();
  for (var i = 0; i < 4; i++) digits.push(makeDigit(i, start[i]));
  canvas.setAttribute('aria-label', start[0] + '' + start[1] + ':' + start[2] + start[3]);
  resize();
  new ResizeObserver(resize).observe(canvas.parentElement);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { readTheme(); draw(); });
  new MutationObserver(function () { readTheme(); draw(); })
    .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  setInterval(tick, 1000);

  window.CarClock = {
    routes: ROUTES, roleOf: roleOf, tuning: TUNING, bays: BAYS, palette: PALETTE,
    digits: digits, plan: planMove, bayPos: bayPos, makeTrip: makeTrip,
    tripPose: tripPose, box: box, hit: hit, offBand: offBand, cars: CARS,
    setTime: function (a, b) {
      var d;
      if (typeof a === 'string') { var m = a.match(/(\d{1,2})\D+(\d{1,2})/); d = [+m[1], +m[2]]; }
      else d = [a, b];
      forced = [Math.floor(d[0] / 10) % 10, d[0] % 10, Math.floor(d[1] / 10) % 10, d[1] % 10];
      tick();
    },
    resume: function () { forced = null; tick(); },
    redraw: draw
  };
})();
</script>
